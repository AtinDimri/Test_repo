name: Commit Tracker Caller

on:
  push:
    branches: [ main ]

jobs:
  call-central-action:
    runs-on: ubuntu-latest

    steps:
      - name: Run central commit tracker
        uses: AtinDimri/github-commit-tracker@main
        with:
          repo_full_name: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          gh_pat: ${{ secrets.GH_PAT }}
          apps_script_webapp_url: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}